[project]
name = "sentiment-analysis"
version = "0.1.0"
description = "A small, modular sentiment-analysis app using TF-IDF and Logistic Regression."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
